[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-coding-harness"
version = "0.1.0"
description = "A verifiable multi-agent coding harness for local open-weight language models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.28,<0.29", "uvicorn>=0.30,<1",
  "mcp>=1.28,<2", "tokenizers>=0.22,<1", "jinja2>=3.1,<4", "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
docs = ["Pillow>=11,<13"]

[project.scripts]
qwen-harness = "qwen_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["sandbox: requires the macOS seatbelt sandbox outside a nested execution sandbox"]
